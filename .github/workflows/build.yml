name: Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Create local.properties & debug keystore
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        echo "storeFile=debug.keystore" >> local.properties
        echo "storePassword=android" >> local.properties
        echo "keyAlias=androiddebugkey" >> local.properties
        echo "keyPassword=android" >> local.properties
        keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleRelease --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: FongMi-Custom-APK
        path: app/build/outputs/apk/**/*.apk